<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minha IA</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0f172a;
  color:#fff;
  height:100vh;
  display:flex;
  flex-direction:column;
}

header{
  height:65px;
  display:flex;
  align-items:center;
  padding:0 18px;
  border-bottom:1px solid #334155;
  background:#111827;
}

.logo{
  font-size:22px;
  font-weight:bold;
}

.logo span{
  margin-right:8px;
}

.chat{
  flex:1;
  overflow-y:auto;
  padding:20px 15px 110px;
}

.mensagem{
  max-width:850px;
  margin:0 auto 18px;
  display:flex;
  gap:10px;
}

.avatar{
  min-width:36px;
  height:36px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#6366f1;
}

.texto{
  line-height:1.5;
  white-space:pre-wrap;
}
